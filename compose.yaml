name: dawi-vet

x-spring-service: &spring-service
  init: true
  restart: unless-stopped
  networks:
    - dawi-vet-network

x-spring-environment: &spring-environment
  TZ: America/Lima
  JAVA_TOOL_OPTIONS: -Xms64m -Xmx384m -Djava.security.egd=file:/dev/./urandom

x-eureka-dependency: &eureka-dependency
  eureka-server:
    condition: service_healthy

services:
  eureka-server:
    <<: *spring-service
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: dawi-vet-eureka-server
    ports:
      - "8761:8761"
    environment:
      <<: *spring-environment
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/8761 &&
          printf 'GET / HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  auth-service:
    <<: *spring-service
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: dawi-vet-auth-service
    environment:
      <<: *spring-environment
    depends_on:
      <<: *eureka-dependency
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  clientes-service:
    <<: *spring-service
    build:
      context: ./clientes-service
      dockerfile: Dockerfile
    container_name: dawi-vet-clientes-service
    environment:
      <<: *spring-environment
    depends_on:
      <<: *eureka-dependency
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  veterinarios-service:
    <<: *spring-service
    build:
      context: ./veterinarios-service
      dockerfile: Dockerfile
    container_name: dawi-vet-veterinarios-service
    environment:
      <<: *spring-environment
    depends_on:
      <<: *eureka-dependency
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8083'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  mascotas-service:
    <<: *spring-service
    build:
      context: ./mascotas-service
      dockerfile: Dockerfile
    container_name: dawi-vet-mascotas-service
    environment:
      <<: *spring-environment
    depends_on:
      <<: *eureka-dependency
      clientes-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8086'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  citas-service:
    <<: *spring-service
    build:
      context: ./citas-service
      dockerfile: Dockerfile
    container_name: dawi-vet-citas-service
    environment:
      <<: *spring-environment
    depends_on:
      <<: *eureka-dependency
      mascotas-service:
        condition: service_healthy
      veterinarios-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8084'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  consultas-service:
    <<: *spring-service
    build:
      context: ./consultas-service
      dockerfile: Dockerfile
    container_name: dawi-vet-consultas-service
    environment:
      <<: *spring-environment
    depends_on:
      <<: *eureka-dependency
      mascotas-service:
        condition: service_healthy
      veterinarios-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8085'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  vacunas-service:
    <<: *spring-service
    build:
      context: ./vacunas-service
      dockerfile: Dockerfile
    container_name: dawi-vet-vacunas-service
    environment:
      <<: *spring-environment
    depends_on:
      <<: *eureka-dependency
      mascotas-service:
        condition: service_healthy
      veterinarios-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8087'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s

  api-gateway:
    <<: *spring-service
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: dawi-vet-api-gateway
    ports:
      - "8080:8080"
    environment:
      <<: *spring-environment
    depends_on:
      <<: *eureka-dependency
      auth-service:
        condition: service_healthy
      clientes-service:
        condition: service_healthy
      veterinarios-service:
        condition: service_healthy
      mascotas-service:
        condition: service_healthy
      citas-service:
        condition: service_healthy
      consultas-service:
        condition: service_healthy
      vacunas-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /api/roles HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

networks:
  dawi-vet-network:
    name: dawi-vet-network
    driver: bridge
