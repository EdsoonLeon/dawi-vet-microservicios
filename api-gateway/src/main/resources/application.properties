server.port=8080
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- Rutas (lb:// = buscar el servicio en Eureka por su nombre) ---
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**,/api/roles/**

spring.cloud.gateway.server.webflux.routes[1].id=clientes-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://clientes-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/clientes/**

spring.cloud.gateway.server.webflux.routes[2].id=veterinarios-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://veterinarios-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/veterinarios/**

spring.cloud.gateway.server.webflux.routes[3].id=citas-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://citas-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/citas/**

spring.cloud.gateway.server.webflux.routes[4].id=consultas-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://consultas-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/consultas/**

spring.cloud.gateway.server.webflux.routes[5].id=mascotas-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://mascotas-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/mascotas/**

# --- CORS para Angular ---
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*