spring.application.name=vacunas-service

server.port=8087

spring.datasource.url=jdbc:mysql://host.docker.internal:3306/vacunas_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.initial-instance-info-replication-interval-seconds=5
eureka.instance.prefer-ip-address=true

jwt.secret=dawivet-clave-secreta-para-jwt-2026-minimo-32

spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000

# Los cuerpos de entrada son contratos cerrados. Los DTO externos toleran campos extra.
spring.jackson.deserialization.fail-on-unknown-properties=true
