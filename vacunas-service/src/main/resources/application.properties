spring.application.name=vacunas-service

server.port=8087

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/vacunas_db?createDatabaseIfNotExist=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# JWT (misma clave que auth-service)
jwt.secret=dawivet-clave-secreta-para-jwt-2026-minimo-32

# OpenFeign: tiempos acotados y sin reintentos automáticos.
spring.cloud.openfeign.client.config.default.connectTimeout=${FEIGN_CONNECT_TIMEOUT:2000}
spring.cloud.openfeign.client.config.default.readTimeout=${FEIGN_READ_TIMEOUT:3000}

# Los cuerpos de entrada son contratos cerrados. Los DTO externos toleran campos extra.
spring.jackson.deserialization.fail-on-unknown-properties=true
